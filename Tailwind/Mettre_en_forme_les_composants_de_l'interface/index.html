<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <div class="flex min-h-screen">

        <!-- Sidebar -->
        <aside class="w-64 bg-gray-800 text-white flex flex-col p-6">

            <h2 class="text-xl font-bold border-b border-gray-600 pb-4">
                Admin Blog
            </h2>

            <nav class="flex flex-col gap-2 mt-4">

                <a href="#"
                   class="px-3 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white">
                    Dashboard
                </a>

                <a href="#"
                   class="px-3 py-2 rounded-lg bg-blue-600 text-white">
                    Categories
                </a>

                <a href="#"
                   class="px-3 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white">
                    Products
                </a>

                <a href="#"
                   class="px-3 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white">
                    Users
                </a>

            </nav>

        </aside>


        <!-- Main -->
        <div class="flex-1 flex flex-col">

            <!-- Header -->
            <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shadow-sm">

                <div>
                    <h1 class="text-xl font-bold text-gray-800">
                        Gestion des catégories
                    </h1>

                    <p class="text-sm text-gray-500">
                        Admin Dashboard
                    </p>
                </div>

                <span class="text-sm text-gray-500">
                    Admin
                </span>

            </header>


            <!-- Content -->
            <main class="flex-1 p-6">

                <div class="max-w-5xl mx-auto">

                    <!-- Form -->
                    <div class="bg-white p-6 rounded-lg shadow-sm">

                        <div class="flex items-center justify-between mb-6">

                            <h2 class="text-lg font-semibold text-gray-800">
                                Nouvelle catégorie
                            </h2>

                            <button
                                class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                                Nouvelle catégorie
                            </button>

                        </div>


                        <form class="flex flex-col gap-4">

                            <div>
                                <label class="text-sm text-gray-700">
                                    Nom de la catégorie
                                </label>

                                <input
                                    type="text"
                                    placeholder="Ex: Technologie"
                                    class="border border-gray-300 rounded-lg w-full p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>


                            <div>
                                <label class="text-sm text-gray-700">
                                    Description
                                </label>

                                <input
                                    type="text"
                                    placeholder="Description de la catégorie"
                                    class="border border-gray-300 rounded-lg w-full p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>


                            <div class="flex gap-2">

                                <button
                                    type="submit"
                                    class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                                    Enregistrer
                                </button>

                                <button
                                    type="button"
                                    class="bg-white text-gray-600 border border-gray-300 px-4 py-2 rounded-lg hover:bg-gray-50">
                                    Annuler
                                </button>

                            </div>

                        </form>

                    </div>


                    <!-- Table -->
                    <div class="bg-white mt-6 rounded-lg shadow-sm">

                        <div class="p-6">

                            <h2 class="text-lg font-semibold text-gray-800">
                                Liste des catégories
                            </h2>

                        </div>


                        <table class="w-full">

                            <thead class="bg-gray-50">

                                <tr>

                                    <th class="text-left text-xs text-gray-500 uppercase p-4">
                                        ID
                                    </th>

                                    <th class="text-left text-xs text-gray-500 uppercase p-4">
                                        Nom
                                    </th>

                                    <th class="text-left text-xs text-gray-500 uppercase p-4">
                                        Description
                                    </th>

                                </tr>

                            </thead>


                            <tbody class="divide-y">

                                <tr class="border-b hover:bg-gray-50">

                                    <td class="p-4 text-sm text-gray-700">
                                        1
                                    </td>

                                    <td class="p-4 text-sm font-medium text-gray-800">
                                        Technologie
                                    </td>

                                    <td class="p-4 text-sm text-gray-500">
                                        Articles sur la technologie
                                    </td>

                                </tr>


                                <tr class="border-b hover:bg-gray-50">

                                    <td class="p-4 text-sm text-gray-700">
                                        2
                                    </td>

                                    <td class="p-4 text-sm font-medium text-gray-800">
                                        Sport
                                    </td>

                                    <td class="p-4 text-sm text-gray-500">
                                        Articles sur le sport
                                    </td>

                                </tr>


                                <tr class="border-b hover:bg-gray-50">

                                    <td class="p-4 text-sm text-gray-700">
                                        3
                                    </td>

                                    <td class="p-4 text-sm font-medium text-gray-800">
                                        Voyage
                                    </td>

                                    <td class="p-4 text-sm text-gray-500">
                                        Articles sur les voyages
                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </main>

        </div>

    </div>

</body>
</html>
