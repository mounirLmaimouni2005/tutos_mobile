
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destination Management</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-800">

    <!-- Sidebar -->
    <aside class="fixed left-0 top-0 hidden h-screen w-64 flex-col bg-slate-900 px-6 py-8 text-white md:flex">

        <h2 class="mb-10 text-xl font-bold tracking-tight">
            Destination
        </h2>

        <div class="flex flex-col gap-2">

            <a href=""
               class="rounded-lg px-4 py-3 text-sm font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white">
                Dashboard
            </a>

            <a href=""
               class="rounded-lg px-4 py-3 text-sm font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white">
                Users
            </a>

            <a href=""
               class="rounded-lg bg-blue-600 px-4 py-3 text-sm font-medium text-white shadow-sm">
                Destinations
            </a>

        </div>

    </aside>


    <!-- Main content -->
    <main class="min-h-screen md:ml-64">

        <!-- Header -->
        <header class="flex min-h-20 flex-wrap items-center justify-between gap-4 border-b border-slate-200 bg-white px-4 py-4 sm:px-6 md:px-8">

            <nav class="flex flex-wrap items-center gap-4 sm:gap-6 md:gap-8">

                <a href=""
                   class="text-sm font-medium text-slate-600 transition hover:text-blue-600">
                    Home
                </a>

                <a href=""
                   class="text-sm font-medium text-slate-600 transition hover:text-blue-600">
                    Contact
                </a>

                <a href=""
                   class="text-sm font-medium text-slate-600 transition hover:text-blue-600">
                    About
                </a>

            </nav>

            <h5 class="rounded-full bg-slate-100 px-4 py-2 text-sm font-semibold text-slate-700">
                Admin
            </h5>

        </header>


        <!-- Content -->
        <section class="space-y-6 p-4 sm:space-y-8 sm:p-6 md:p-8">

            <!-- Form -->
            <form action=""
                  class="w-full max-w-3xl rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:p-6">

                <div class="mb-6">
                    <h1 class="text-xl font-bold text-slate-900">
                        Add Destination
                    </h1>

                    <p class="mt-1 text-sm text-slate-500">
                        Add a new destination to your database.
                    </p>
                </div>


                <div class="flex flex-col gap-5">

                    <div class="flex flex-col gap-2">
                        <label for="nom"
                               class="text-sm font-medium text-slate-700">
                            Nom
                        </label>

                        <input type="text"
                               id="nom"
                               class="w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10">
                    </div>


                    <div class="flex flex-col gap-2">
                        <label for="description"
                               class="text-sm font-medium text-slate-700">
                            Description
                        </label>

                        <input type="text"
                               id="description"
                               class="w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10">
                    </div>


                    <div class="flex flex-col gap-2">
                        <label for="region"
                               class="text-sm font-medium text-slate-700">
                            Region
                        </label>

                        <input type="text"
                               id="region"
                               class="w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10">
                    </div>


                    <div class="flex flex-wrap items-center gap-3 pt-2">

                        <button type="submit"
                                id="submit"
                                class="w-full rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-500/20 sm:w-auto">
                            Ajouter destination
                        </button>

                        <button type="reset"
                                class="w-full rounded-lg border border-slate-300 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-slate-200 sm:w-auto">
                            Reset
                        </button>

                    </div>

                </div>

            </form>


            <!-- Table -->
            <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">

                <div class="border-b border-slate-200 px-4 py-5 sm:px-6">
                    <h2 class="text-lg font-semibold text-slate-900">
                        Destinations
                    </h2>

                    <p class="mt-1 text-sm text-slate-500">
                        List of available destinations.
                    </p>
                </div>


                <div class="overflow-x-auto">

                    <table class="w-full min-w-[700px] text-left">

                        <thead class="bg-slate-50">

                            <tr>
                                <th class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-slate-500">
                                    ID
                                </th>

                                <th class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-slate-500">
                                    Nom
                                </th>

                                <th class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-slate-500">
                                    Description
                                </th>

                                <th class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-slate-500">
                                    Region
                                </th>
                            </tr>

                        </thead>


                        <tbody id="tbody"
                               class="divide-y divide-slate-200">
                             
                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="border-t border-slate-200 bg-white py-6 text-center text-sm text-slate-500 md:ml-64">
        &copy; 2026 Destination Management
    </footer>


    <script src="app.js"></script>

</body>
</html>
